<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal Records - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #f5f5f5;
            font-family: 'IBM Plex Mono', monospace;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .login-box {
            max-width: 400px;
            margin: 5rem auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
        }
        .subscriber-row {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 1rem;
            align-items: center;
            font-size: 0.85rem;
        }
        .status-synced { color: #90EE90; }
        .status-error { color: #FFB6B6; }
        .btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f5f5f5;
            border-radius: 0.4rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-primary {
            background: white;
            color: #0a0a0a;
            font-weight: bold;
        }
        .btn-primary:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-box">
            <h1 class="text-2xl font-bold mb-6 text-center">Liminal Admin</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="text-xs uppercase opacity-60">Contraseña</label>
                    <input type="password" id="admin-password" placeholder="••••••••" required class="w-full bg-zinc-900 border border-white/10 px-3 py-2 text-sm outline-none focus:border-white/30 transition">
                </div>
                <button type="submit" class="btn btn-primary w-full">Entrar</button>
                <div id="login-error" class="text-xs text-red-400 text-center opacity-0 transition-opacity"></div>
            </form>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold">Panel de Suscriptores</h1>
                    <p class="text-xs opacity-40 mt-1">Liminal Records Newsletter</p>
                </div>
                <button id="logout-btn" class="btn">Salir</button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="p-4 bg-white/5 border border-white/10 rounded">
                    <p class="text-xs opacity-40 uppercase">Total Suscriptores</p>
                    <p class="text-2xl font-bold mt-2" id="total-count">0</p>
                </div>
                <div class="p-4 bg-white/5 border border-white/10 rounded">
                    <p class="text-xs opacity-40 uppercase">Sincronizados MailerLite</p>
                    <p class="text-2xl font-bold mt-2" id="synced-count">0</p>
                </div>
                <div class="p-4 bg-white/5 border border-white/10 rounded">
                    <p class="text-xs opacity-40 uppercase">Acciones</p>
                    <div class="mt-2 space-x-2 flex">
                        <button id="refresh-btn" class="btn text-xs">Recargar</button>
                        <button id="export-btn" class="btn text-xs">Descargar CSV</button>
                    </div>
                </div>
            </div>

            <!-- Subscribers List -->
            <div class="bg-white/2 border border-white/10 rounded">
                <div class="p-4 border-b border-white/10">
                    <h2 class="text-lg font-bold">Suscriptores</h2>
                </div>
                <div id="subscribers-list" class="max-h-[600px] overflow-y-auto">
                    <p class="p-4 text-xs opacity-50 text-center">Cargando...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const exportBtn = document.getElementById('export-btn');
        const subscribersList = document.getElementById('subscribers-list');
        const totalCount = document.getElementById('total-count');
        const syncedCount = document.getElementById('synced-count');

        let authToken = null;

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;

            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                authToken = data.token;
                loginScreen.classList.add('hidden');
                dashboard.classList.remove('hidden');
                loadSubscribers();
            } catch (error) {
                loginError.textContent = error.message;
                loginError.style.opacity = '1';
            }
        });

        logoutBtn.addEventListener('click', () => {
            authToken = null;
            loginScreen.classList.remove('hidden');
            dashboard.classList.add('hidden');
            document.getElementById('admin-password').value = '';
            loginError.style.opacity = '0';
        });

        async function loadSubscribers() {
            try {
                const response = await fetch('/api/admin/subscribers', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Acceso denegado');

                const data = await response.json();
                totalCount.textContent = data.count;
                syncedCount.textContent = data.mailerliteSyncedCount;

                const html = data.subscribers.length === 0
                    ? '<p class="p-4 text-xs opacity-50 text-center">No hay suscriptores aún.</p>'
                    : `
                        <div class="text-xs uppercase opacity-40 p-4 border-b border-white/10 grid grid-cols-4 gap-1">
                            <div>Email</div>
                            <div>Nombre</div>
                            <div>Fecha</div>
                            <div>MailerLite</div>
                        </div>
                        ${data.subscribers.map(s => `
                            <div class="subscriber-row">
                                <div>${s.email}</div>
                                <div>${s.name}</div>
                                <div class="text-xs opacity-60">${new Date(s.createdAt).toLocaleDateString('es-AR')}</div>
                                <div class="${s.mailerliteSynced ? 'status-synced' : 'status-error'}">${s.mailerliteSynced ? '✓ Sí' : '✗ No'}</div>
                            </div>
                        `).join('')}
                    `;

                subscribersList.innerHTML = html;
            } catch (error) {
                subscribersList.innerHTML = `<p class="p-4 text-xs text-red-400">${error.message}</p>`;
            }
        }

        refreshBtn.addEventListener('click', loadSubscribers);

        exportBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/admin/export-csv', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Error al exportar');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'liminal-suscriptores.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('Error al descargar: ' + error.message);
            }
        });
    </script>
</body>
</html>
