<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal Records - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #070707;
            color: #f5f5f5;
            font-family: 'IBM Plex Mono', monospace;
            margin: 0;
            padding: 24px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .login-box {
            max-width: 380px;
            margin: 80px auto;
            padding: 32px;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
        }
        .eyebrow { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #666; }
        .input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            font: 12px 'IBM Plex Mono', monospace;
            width: 100%;
            border-radius: 4px;
            outline: none;
            margin-top: 6px;
            margin-bottom: 14px;
        }
        .input:focus { border-color: #777; }
        .btn {
            border: 1px solid #444;
            background: transparent;
            color: #fff;
            padding: 10px 16px;
            font: 10px 'IBM Plex Mono', monospace;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { background: #fff; color: #000; border-color: #fff; }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-primary { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
        .btn-primary:hover:not(:disabled) { background: #e0e0e0; }
        .btn-sm { padding: 6px 10px; font-size: 9px; }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #111;
            border: 1px solid #222;
            padding: 20px;
            border-radius: 6px;
        }
        .stat-card strong { display: block; font-size: 28px; font-weight: 400; margin-top: 6px; }

        .section-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            font: 11px 'IBM Plex Mono', monospace;
            border-radius: 4px;
            outline: none;
            min-width: 240px;
        }
        .search-input:focus { border-color: #777; }

        .row-item {
            padding: 12px 20px;
            border-bottom: 1px solid #181818;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 12px;
            font-size: 11px;
            align-items: center;
        }
        .row-item.tickets-grid {
            grid-template-columns: 1.6fr 1.6fr 0.9fr 1.2fr 1fr;
        }
        .row-item.head { color: #666; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
        .status-yes { color: #52b788; }
        .status-no { color: #d4a373; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .row-item, .row-item.tickets-grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .row-item.head { display: none; }
            .search-input { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-box">
            <div class="eyebrow">ACCESO RESTRINGIDO</div>
            <h1 style="font-size: 22px; margin: 8px 0 20px 0;">Liminal Access</h1>
            <form id="login-form">
                <label class="eyebrow">Usuario</label>
                <input type="text" id="admin-user" required class="input" placeholder="ej: saito" autocomplete="username">
                
                <label class="eyebrow">Contraseña</label>
                <div style="position: relative;">
                    <input type="password" id="admin-password" required class="input" placeholder="••••••••" autocomplete="current-password" style="padding-right: 40px; margin-bottom: 0;">
                    <button type="button" id="toggle-pass" style="position: absolute; right: 10px; top: 40%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; font-size: 14px;" title="Ver contraseña">👁️</button>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 18px;">Ingresar</button>
                <div id="login-error" style="color: #ffccd5; font-size: 11px; margin-top: 12px; text-align: center;"></div>
            </form>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #222; padding-bottom: 16px; gap: 12px; flex-wrap: wrap;">
                <div>
                    <span class="eyebrow">PANEL GENERAL</span>
                    <h1 style="font-size: 24px; margin: 4px 0 0 0;">Liminal Records & Eventos</h1>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <a href="/eventos/checkin.html" target="_blank" style="text-decoration: none;">
                        <button type="button" class="btn btn-primary">📷 Abrir Escáner de Puerta</button>
                    </a>
                    <button type="button" id="logout-btn" class="btn">Salir</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid-stats">
                <div class="stat-card">
                    <span class="eyebrow">Entradas Emitidas</span>
                    <strong id="tickets-reserved">0</strong>
                </div>
                <div class="stat-card">
                    <span class="eyebrow">Ingresaron al Evento</span>
                    <strong id="tickets-checked" class="status-yes">0</strong>
                </div>
                <div class="stat-card">
                    <span class="eyebrow">Faltan Entrar</span>
                    <strong id="tickets-pending" class="status-no">0</strong>
                </div>
                <div class="stat-card">
                    <span class="eyebrow">Suscriptores Newsletter</span>
                    <strong id="total-count">0</strong>
                    <div class="eyebrow" style="margin-top: 8px;">MailerLite: <span id="synced-count">0</span></div>
                </div>
            </div>

            <!-- Event Tickets List -->
            <div class="section-box">
                <div class="section-header">
                    <span style="font-size: 13px; font-weight: 500;">Entradas · THIS IS TOBBA</span>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                        <input type="text" id="ticket-search" class="search-input" placeholder="Buscar nombre, mail o código...">
                        <button type="button" id="refresh-tickets-btn" class="btn btn-sm">Recargar</button>
                    </div>
                </div>
                <div id="tickets-list">
                    <p style="padding: 24px; text-align: center; color: #666; font-size: 11px;">Cargando entradas...</p>
                </div>
            </div>

            <!-- Subscribers List -->
            <div class="section-box">
                <div class="section-header">
                    <span style="font-size: 13px; font-weight: 500;">Suscriptores del Newsletter</span>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" id="refresh-btn" class="btn btn-sm">Recargar</button>
                        <button type="button" id="export-btn" class="btn btn-sm">Descargar CSV</button>
                    </div>
                </div>
                <div id="subscribers-list">
                    <p style="padding: 24px; text-align: center; color: #666; font-size: 11px;">Cargando registros...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('liminal_admin_token') || '';
        let allTickets = [];

        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('dashboard');

        function openDashboard() {
            loginScreen.classList.add('hidden');
            dashboard.classList.remove('hidden');
            loadSubscribers();
            loadTickets();
        }

        if (authToken) {
            openDashboard();
        }

        // Mostrar / Ocultar contraseña
        document.getElementById('toggle-pass').addEventListener('click', () => {
            const passInput = document.getElementById('admin-password');
            const toggleBtn = document.getElementById('toggle-pass');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.textContent = '🔒';
            } else {
                passInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('admin-user').value.trim();
            const password = document.getElementById('admin-password').value;
            const errBox = document.getElementById('login-error');
            errBox.textContent = 'Verificando...';

            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Credenciales inválidas');

                authToken = data.token;
                localStorage.setItem('liminal_admin_token', authToken);
                errBox.textContent = '';
                openDashboard();
            } catch (error) {
                errBox.textContent = error.message;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            authToken = '';
            allTickets = [];
            localStorage.removeItem('liminal_admin_token');
            dashboard.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-password').value = '';
        });

        async function loadTickets() {
            const list = document.getElementById('tickets-list');
            try {
                const response = await fetch('/api/admin/event-tickets', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!response.ok) throw new Error('No se pudieron cargar las entradas');

                const data = await response.json();
                allTickets = data.tickets || [];

                const reserved = typeof data.reserved === 'number' ? data.reserved : allTickets.length;
                const checkedIn = typeof data.checkedIn === 'number' ? data.checkedIn : allTickets.filter(t => t.checkedInAt).length;
                const pending = typeof data.pendingCheckIn === 'number' ? data.pendingCheckIn : Math.max(0, reserved - checkedIn);

                document.getElementById('tickets-reserved').textContent = reserved;
                document.getElementById('tickets-checked').textContent = checkedIn;
                document.getElementById('tickets-pending').textContent = pending;

                renderTickets(allTickets);
            } catch (error) {
                list.innerHTML = `<p style="padding: 24px; text-align: center; color: #ffccd5; font-size: 11px;">${escapeHtml(error.message)}</p>`;
            }
        }

        function renderTickets(ticketsToRender) {
            const list = document.getElementById('tickets-list');
            const headHtml = '<div class="row-item tickets-grid head"><div>Asistente</div><div>Correo</div><div>Código</div><div>Estado</div><div>Acción</div></div>';

            if (!ticketsToRender || ticketsToRender.length === 0) {
                list.innerHTML = headHtml + '<div style="padding: 24px; text-align: center; color: #666; font-size: 11px;">No hay entradas que coincidan.</div>';
                return;
            }

            list.innerHTML = headHtml + ticketsToRender.map(t => {
                const isChecked = Boolean(t.checkedInAt);
                const hora = isChecked
                    ? new Date(t.checkedInAt).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
                    : '';
                const statusHtml = isChecked
                    ? `<span class="status-yes">✓ Ingresó (${escapeHtml(hora)} hs)</span>`
                    : `<span class="status-no">• Pendiente</span>`;

                const actionHtml = isChecked
                    ? `<span style="color:#666; font-size:10px;">${escapeHtml(t.checkedInBy || 'validada')}</span>`
                    : `<button type="button" class="btn btn-sm" onclick="manualCheckIn('${escapeHtml(t.code)}')">Marcar ingreso</button>`;

                return `
                    <div class="row-item tickets-grid">
                        <div><strong>${escapeHtml(t.name)}</strong>${t.guest ? ' <span style="color:#666;">(acompañante)</span>' : ''}</div>
                        <div style="word-break: break-all; color: #bbb;">${escapeHtml(t.email)}</div>
                        <div><strong>${escapeHtml(t.code)}</strong></div>
                        <div>${statusHtml}</div>
                        <div>${actionHtml}</div>
                    </div>
                `;
            }).join('');
        }

        async function manualCheckIn(code) {
            if (!code) return;
            try {
                const response = await fetch('/api/admin/event-check-in', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ token: code })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Error al marcar ingreso');
                await loadTickets();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        document.getElementById('ticket-search').addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) {
                renderTickets(allTickets);
                return;
            }
            const filtered = allTickets.filter(t =>
                String(t.name || '').toLowerCase().includes(q) ||
                String(t.email || '').toLowerCase().includes(q) ||
                String(t.code || '').toLowerCase().includes(q) ||
                String(t.city || '').toLowerCase().includes(q)
            );
            renderTickets(filtered);
        });

        document.getElementById('refresh-tickets-btn').addEventListener('click', loadTickets);

        async function loadSubscribers() {
            try {
                const response = await fetch('/api/admin/subscribers', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Sesión expirada o denegada');

                const data = await response.json();
                document.getElementById('total-count').textContent = data.count;
                document.getElementById('synced-count').textContent = data.mailerliteSyncedCount;

                const list = document.getElementById('subscribers-list');
                const headHtml = '<div class="row-item head"><div>Email</div><div>Nombre</div><div>Fecha</div><div>MailerLite</div></div>';
                
                if (!data.subscribers || data.subscribers.length === 0) {
                    list.innerHTML = headHtml + '<div style="padding: 24px; text-align: center; color: #666; font-size: 11px;">No hay suscriptores aún.</div>';
                    return;
                }

                list.innerHTML = headHtml + data.subscribers.map(s => `
                    <div class="row-item">
                        <div style="word-break: break-all;">${escapeHtml(s.email)}</div>
                        <div>${escapeHtml(s.name)}</div>
                        <div style="color: #666;">${new Date(s.createdAt).toLocaleDateString('es-AR')}</div>
                        <div class="${s.mailerliteSynced ? 'status-yes' : 'status-no'}">${s.mailerliteSynced ? '✓ Sí' : '• Pendiente'}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('subscribers-list').innerHTML = `<p style="padding: 24px; text-align: center; color: #ffccd5; font-size: 11px;">${error.message}</p>`;
            }
        }

        document.getElementById('refresh-btn').addEventListener('click', loadSubscribers);

        document.getElementById('export-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/admin/export-csv', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!response.ok) throw new Error('Error al exportar');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'liminal-suscriptores.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('Error al descargar: ' + error.message);
            }
        });

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
        }
    </script>
</body>
</html>
