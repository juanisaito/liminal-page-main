<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal Records - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #070707;
            color: #f5f5f5;
            font-family: 'IBM Plex Mono', monospace;
            margin: 0;
            padding: 24px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .login-box {
            max-width: 380px;
            margin: 80px auto;
            padding: 32px;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
        }
        .eyebrow { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #666; }
        .input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            font: 12px 'IBM Plex Mono', monospace;
            width: 100%;
            border-radius: 4px;
            outline: none;
            margin-top: 6px;
            margin-bottom: 14px;
        }
        .input:focus { border-color: #777; }
        .btn {
            border: 1px solid #444;
            background: transparent;
            color: #fff;
            padding: 10px 16px;
            font: 10px 'IBM Plex Mono', monospace;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover { background: #fff; color: #000; border-color: #fff; }
        .btn-primary { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
        .btn-primary:hover { background: #e0e0e0; }
        
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #111;
            border: 1px solid #222;
            padding: 20px;
            border-radius: 6px;
        }
        .stat-card strong { display: block; font-size: 28px; font-weight: 400; margin-top: 6px; }
        
        .section-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .row-item {
            padding: 12px 20px;
            border-bottom: 1px solid #181818;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 12px;
            font-size: 11px;
            align-items: center;
        }
        .row-item.head { color: #666; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
        .status-yes { color: #52b788; }
        .status-no { color: #d4a373; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-box">
            <div class="eyebrow">ACCESO RESTRINGIDO</div>
            <h1 style="font-size: 22px; margin: 8px 0 20px 0;">Liminal Access</h1>
            <form id="login-form">
                <label class="eyebrow">Usuario</label>
                <input type="text" id="admin-user" required class="input" placeholder="ej: saito" autocomplete="username">
                
                <label class="eyebrow">Contraseña</label>
                <div style="position: relative;">
                    <input type="password" id="admin-password" required class="input" placeholder="••••••••" autocomplete="current-password" style="padding-right: 40px; margin-bottom: 0;">
                    <button type="button" id="toggle-pass" style="position: absolute; right: 10px; top: 40%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; font-size: 14px;" title="Ver contraseña">👁️</button>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 18px;">Ingresar</button>
                <div id="login-error" style="color: #ffccd5; font-size: 11px; margin-top: 12px; text-align: center;"></div>
            </form>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #222; padding-bottom: 16px;">
                <div>
                    <span class="eyebrow">PANEL GENERAL</span>
                    <h1 style="font-size: 24px; margin: 4px 0 0 0;">Liminal Records & Eventos</h1>
                </div>
                <div style="display: flex; gap: 10px;">
                    <a href="/eventos/checkin.html" target="_blank" style="text-decoration: none;">
                        <button class="btn btn-primary">📷 Abrir Escáner de Puerta</button>
                    </a>
                    <button id="logout-btn" class="btn">Salir</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid-stats">
                <div class="stat-card">
                    <span class="eyebrow">Total Suscriptores</span>
                    <strong id="total-count">0</strong>
                </div>
                <div class="stat-card">
                    <span class="eyebrow">Sincronizados MailerLite</span>
                    <strong id="synced-count">0</strong>
                </div>
                <div class="stat-card">
                    <span class="eyebrow">Acciones</span>
                    <div style="margin-top: 10px; display: flex; gap: 8px;">
                        <button id="refresh-btn" class="btn" style="font-size: 9px;">Recargar</button>
                        <button id="export-btn" class="btn" style="font-size: 9px;">Descargar CSV</button>
                    </div>
                </div>
            </div>

            <!-- Subscribers List -->
            <div class="section-box">
                <div class="section-header">
                    <span style="font-size: 13px; font-weight: 500;">Suscriptores del Newsletter</span>
                </div>
                <div id="subscribers-list">
                    <p style="padding: 24px; text-align: center; color: #666; font-size: 11px;">Cargando registros...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('liminal_admin_token') || '';

        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('dashboard');

        if (authToken) {
            loginScreen.classList.add('hidden');
            dashboard.classList.remove('hidden');
            loadSubscribers();
        }

        // Mostrar / Ocultar contraseña
        document.getElementById('toggle-pass').addEventListener('click', () => {
            const passInput = document.getElementById('admin-password');
            const toggleBtn = document.getElementById('toggle-pass');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.textContent = '🔒';
            } else {
                passInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('admin-user').value.trim();
            const password = document.getElementById('admin-password').value;
            const errBox = document.getElementById('login-error');
            errBox.textContent = 'Verificando...';

            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Credenciales inválidas');

                authToken = data.token;
                localStorage.setItem('liminal_admin_token', authToken);
                loginScreen.classList.add('hidden');
                dashboard.classList.remove('hidden');
                loadSubscribers();
            } catch (error) {
                errBox.textContent = error.message;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            authToken = '';
            localStorage.removeItem('liminal_admin_token');
            loginScreen.classList.add('hidden');
            dashboard.classList.add('hidden');
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-password').value = '';
        });

        async function loadSubscribers() {
            try {
                const response = await fetch('/api/admin/subscribers', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Sesión expirada o denegada');

                const data = await response.json();
                document.getElementById('total-count').textContent = data.count;
                document.getElementById('synced-count').textContent = data.mailerliteSyncedCount;

                const list = document.getElementById('subscribers-list');
                const headHtml = '<div class="row-item head"><div>Email</div><div>Nombre</div><div>Fecha</div><div>MailerLite</div></div>';
                
                if (!data.subscribers || data.subscribers.length === 0) {
                    list.innerHTML = headHtml + '<div style="padding: 24px; text-align: center; color: #666; font-size: 11px;">No hay suscriptores aún.</div>';
                    return;
                }

                list.innerHTML = headHtml + data.subscribers.map(s => `
                    <div class="row-item">
                        <div style="word-break: break-all;">${escapeHtml(s.email)}</div>
                        <div>${escapeHtml(s.name)}</div>
                        <div style="color: #666;">${new Date(s.createdAt).toLocaleDateString('es-AR')}</div>
                        <div class="${s.mailerliteSynced ? 'status-yes' : 'status-no'}">${s.mailerliteSynced ? '✓ Sí' : '• Pendiente'}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('subscribers-list').innerHTML = `<p style="padding: 24px; text-align: center; color: #ffccd5; font-size: 11px;">${error.message}</p>`;
            }
        }

        document.getElementById('refresh-btn').addEventListener('click', loadSubscribers);

        document.getElementById('export-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/admin/export-csv', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!response.ok) throw new Error('Error al exportar');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'liminal-suscriptores.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('Error al descargar: ' + error.message);
            }
        });

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
        }
    </script>
</body>
</html>
