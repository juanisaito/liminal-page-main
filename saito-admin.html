<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>saito admin · promos & mails</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: #0b0b0c;
      color: #f4f4f0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    .box {
      background: #131316;
      border: 1px solid #25252b;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 24px;
    }
    h1 { font-size: 20px; margin: 4px 0 0; }
    h2 { font-size: 13px; margin: 0 0 14px; text-transform: uppercase; letter-spacing: .08em; }
    .eyebrow { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .16em; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: #aaa; margin-bottom: 5px; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
      width: 100%;
      background: #0b0b0c;
      border: 1px solid #2e2e36;
      color: #fff;
      padding: 9px 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
    }
    .btn {
      background: #f4f4f0;
      color: #0b0b0c;
      border: 1px solid #f4f4f0;
      padding: 8px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.ghost { background: transparent; color: #f4f4f0; border-color: #3a3a44; font-weight: 400; }
    .btn.sm { padding: 5px 10px; font-size: 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .list-row {
      display: grid;
      grid-template-columns: 1.5fr 1.5fr 1fr 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #202026;
      align-items: center;
    }
    .list-row.head { color: #777; font-size: 10px; text-transform: uppercase; }
    .ok { color: #4ade80; }
    .hidden { display: none !important; }
    @media (max-width: 680px) {
      .list-row { grid-template-columns: 1fr; gap: 4px; }
      .list-row.head { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="login-box" class="box" style="max-width:380px;margin:70px auto;">
      <div class="eyebrow">SAITONEPROD ADMIN</div>
      <h1 style="margin-bottom:16px;">Acceso</h1>
      <form id="login-form">
        <label for="u">Usuario</label>
        <input id="u" type="text" required style="margin-bottom:12px;" />
        <label for="p">Contraseña</label>
        <input id="p" type="password" required style="margin-bottom:16px;" />
        <button type="submit" class="btn" style="width:100%;">Entrar</button>
        <div id="login-err" style="color:#f87171;margin-top:10px;"></div>
      </form>
    </div>

    <div id="panel" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap;">
        <div>
          <div class="eyebrow">CONTROL DE PROMOS & LEADS</div>
          <h1>Saitoneprod Admin</h1>
        </div>
        <div class="actions">
          <a href="/saitoneprod" target="_blank" class="btn ghost" style="text-decoration:none;">Ver /saitoneprod</a>
          <button type="button" class="btn ghost" id="logout-btn">Salir</button>
        </div>
      </div>

      <div class="box">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
          <h2 style="margin:0;">1. Promo interactiva</h2>
          <button type="button" class="btn" id="btn-all-promo-toggle">TODO EN PROMO: ON</button>
        </div>

        <div class="row">
          <div>
            <label for="cfg-base-price">Precio base (ARS)</label>
            <input id="cfg-base-price" type="number" min="1000" step="1000" value="85000" />
          </div>
          <div>
            <label for="cfg-discount">Descuento (%)</label>
            <input id="cfg-discount" type="number" min="0" max="90" step="5" value="40" />
          </div>
          <div>
            <label for="cfg-label">Etiqueta en la web</label>
            <input id="cfg-label" type="text" value="promo activa" />
          </div>
          <div>
            <label>Precio final calculado</label>
            <div id="live-price-preview" style="padding:9px 10px;background:#0b0b0c;border:1px solid #2e2e36;border-radius:4px;color:#4ade80;font-weight:600;">
              $51.000
            </div>
          </div>
        </div>

        <label style="margin-top:6px;">Modo de días:</label>
        <div class="actions" id="day-mode-group" style="margin-bottom:14px;">
          <button type="button" class="btn sm" data-daymode="all">Todos los días</button>
          <button type="button" class="btn sm ghost" data-daymode="weekdays">Lun a Vie</button>
          <button type="button" class="btn sm ghost" data-daymode="weekends">Sábados</button>
          <button type="button" class="btn sm ghost" data-daymode="custom">Elegir fechas</button>
        </div>

        <div id="custom-dates-picker" class="hidden" style="margin-bottom:14px;">
          <label>Tocá las fechas específicas en promo:</label>
          <div id="promo-dates-chips" class="actions"></div>
        </div>

        <label>Horarios en promo (clic para activar/desactivar):</label>
        <div class="actions" id="interactive-slots-group" style="margin-bottom:16px;">
          <button type="button" class="btn sm" data-slot="11:00">11:00</button>
          <button type="button" class="btn sm" data-slot="14:00">14:00</button>
          <button type="button" class="btn sm" data-slot="16:30">16:30</button>
          <button type="button" class="btn sm" data-slot="19:00">19:00</button>
        </div>

        <div class="actions">
          <button type="button" class="btn" id="save-cfg-btn">Aplicar cambios en la web</button>
          <span id="cfg-status" class="ok"></span>
        </div>
      </div>

      <div class="box">
        <h2>2. Mails guardados para promos (<span id="emails-count">0</span>)</h2>
        <form id="add-email-form" class="row" style="align-items:end;">
          <div>
            <label for="new-email">Agregar mail manual</label>
            <input id="new-email" type="email" placeholder="artista@mail.com" required />
          </div>
          <div>
            <label for="new-name">Nombre (opcional)</label>
            <input id="new-name" type="text" placeholder="Nombre" />
          </div>
          <div class="actions">
            <button type="submit" class="btn">Guardar mail</button>
            <button type="button" class="btn ghost" id="copy-emails-btn">Copiar todos</button>
            <button type="button" class="btn ghost" id="download-emails-btn">Descargar CSV</button>
          </div>
        </form>
        <div id="emails-list"></div>
      </div>

      <div class="box">
        <h2>3. Turnos y comprobantes</h2>
        <div id="bookings-list"></div>
      </div>
    </div>
  </div>

  <script>
    const ALL_SLOTS = ['11:00', '14:00', '16:30', '19:00'];
    let token = localStorage.getItem('saito_admin_token') || '';
    let promoEmails = [];
    let promoState = {
      allPromo: true,
      basePriceArs: 85000,
      discountPercent: 40,
      promoLabel: 'promo activa',
      alias: 'saitoneprod',
      dayMode: 'all',
      promoDates: [],
      promoSlots: [...ALL_SLOTS]
    };

    function authHeaders(extra = {}) {
      return { 'Authorization': `Bearer ${token}`, ...extra };
    }

    function showPanel() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      loadAll();
    }

    if (token) showPanel();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      const err = document.getElementById('login-err');
      err.textContent = 'Entrando...';
      try {
        const res = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        token = data.token;
        localStorage.setItem('saito_admin_token', token);
        err.textContent = '';
        showPanel();
      } catch (ex) {
        err.textContent = ex.message;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      token = '';
      localStorage.removeItem('saito_admin_token');
      document.getElementById('panel').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
    });

    function updatePricePreview() {
      const base = Number(document.getElementById('cfg-base-price').value) || 0;
      const disc = Math.min(90, Math.max(0, Number(document.getElementById('cfg-discount').value) || 0));
      const finalPrice = Math.round(base * (1 - disc / 100));
      document.getElementById('live-price-preview').textContent =
        `$${finalPrice.toLocaleString('es-AR')} (antes $${base.toLocaleString('es-AR')})`;
    }

    function renderInteractivePromoUI() {
      document.getElementById('cfg-base-price').value = promoState.basePriceArs;
      document.getElementById('cfg-discount').value = promoState.discountPercent;
      document.getElementById('cfg-label').value = promoState.promoLabel;
      updatePricePreview();

      const allBtn = document.getElementById('btn-all-promo-toggle');
      allBtn.textContent = promoState.allPromo ? 'TODO EN PROMO: ON' : 'TODO EN PROMO: OFF';
      allBtn.classList.toggle('ghost', !promoState.allPromo);

      document.querySelectorAll('#day-mode-group button').forEach((btn) => {
        btn.classList.toggle('ghost', btn.dataset.daymode !== promoState.dayMode);
      });

      document.getElementById('custom-dates-picker').classList.toggle('hidden', promoState.dayMode !== 'custom');

      document.querySelectorAll('#interactive-slots-group button').forEach((btn) => {
        const active = promoState.allPromo || promoState.promoSlots.includes(btn.dataset.slot);
        btn.classList.toggle('ghost', !active);
      });

      const chipsWrap = document.getElementById('promo-dates-chips');
      chipsWrap.innerHTML = '';
      const now = new Date();
      for (let i = 1; i <= 15; i++) {
        const d = new Date(now);
        d.setDate(now.getDate() + i);
        if (d.getDay() === 0) continue;
        const iso = d.toISOString().slice(0, 10);
        const label = d.toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit' });
        const chip = document.createElement('button');
        chip.type = 'button';
        const isSelected = promoState.promoDates.includes(iso);
        chip.className = `btn sm ${isSelected ? '' : 'ghost'}`;
        chip.textContent = label;
        chip.addEventListener('click', () => {
          if (promoState.promoDates.includes(iso)) {
            promoState.promoDates = promoState.promoDates.filter((x) => x !== iso);
          } else {
            promoState.promoDates.push(iso);
          }
          renderInteractivePromoUI();
        });
        chipsWrap.appendChild(chip);
      }
    }

    document.getElementById('btn-all-promo-toggle').addEventListener('click', () => {
      promoState.allPromo = !promoState.allPromo;
      if (promoState.allPromo) {
        promoState.dayMode = 'all';
        promoState.promoSlots = [...ALL_SLOTS];
      }
      renderInteractivePromoUI();
    });

    document.querySelectorAll('#day-mode-group button').forEach((btn) => {
      btn.addEventListener('click', () => {
        promoState.dayMode = btn.dataset.daymode;
        if (promoState.dayMode !== 'all') promoState.allPromo = false;
        renderInteractivePromoUI();
      });
    });

    document.querySelectorAll('#interactive-slots-group button').forEach((btn) => {
      btn.addEventListener('click', () => {
        promoState.allPromo = false;
        const slot = btn.dataset.slot;
        if (promoState.promoSlots.includes(slot)) {
          promoState.promoSlots = promoState.promoSlots.filter((s) => s !== slot);
        } else {
          promoState.promoSlots.push(slot);
        }
        renderInteractivePromoUI();
      });
    });

    ['cfg-base-price', 'cfg-discount'].forEach((id) => {
      document.getElementById(id).addEventListener('input', updatePricePreview);
    });

    async function loadConfig() {
      const res = await fetch('/api/saito-config');
      const cfg = await res.json();
      promoState = { ...promoState, ...cfg };
      renderInteractivePromoUI();
    }

    document.getElementById('save-cfg-btn').addEventListener('click', async () => {
      const status = document.getElementById('cfg-status');
      status.textContent = 'Guardando...';
      const body = {
        ...promoState,
        basePriceArs: Number(document.getElementById('cfg-base-price').value),
        discountPercent: Number(document.getElementById('cfg-discount').value),
        promoLabel: document.getElementById('cfg-label').value.trim()
      };
      const res = await fetch('/api/admin/saito-config', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body)
      });
      status.textContent = res.ok ? '✓ Actualizado en vivo' : 'Error al guardar';
      setTimeout(() => { status.textContent = ''; }, 2200);
    });

    async function loadPromoEmails() {
      const res = await fetch('/api/admin/promo-emails', { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      promoEmails = data.emails || [];
      document.getElementById('emails-count').textContent = promoEmails.length;
      const head = '<div class="list-row head"><div>Email</div><div>Nombre</div><div>Origen</div><div>Fecha</div></div>';
      if (!promoEmails.length) {
        document.getElementById('emails-list').innerHTML = head + '<div style="padding:12px 0;color:#777;">Sin mails guardados todavía.</div>';
        return;
      }
      document.getElementById('emails-list').innerHTML = head + promoEmails.map(item => `
        <div class="list-row">
          <div>${esc(item.email)}</div>
          <div>${esc(item.name || '-')}</div>
          <div>${esc(item.type || 'web')}</div>
          <div style="color:#888;">${item.capturedAt ? new Date(item.capturedAt).toLocaleDateString('es-AR') : '-'}</div>
        </div>
      `).join('');
    }

    document.getElementById('add-email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('new-email').value.trim();
      const name = document.getElementById('new-name').value.trim();
      if (!email) return;
      await fetch('/api/promo-emails', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name, type: 'manual' })
      });
      document.getElementById('new-email').value = '';
      document.getElementById('new-name').value = '';
      loadPromoEmails();
    });

    document.getElementById('copy-emails-btn').addEventListener('click', async () => {
      const list = promoEmails.map(x => x.email).join(', ');
      await navigator.clipboard.writeText(list);
      alert('Mails copiados al portapapeles');
    });

    document.getElementById('download-emails-btn').addEventListener('click', () => {
      const rows = ['Email,Nombre,Origen,Fecha'].concat(
        promoEmails.map(x => `"${x.email}","${x.name || ''}","${x.type || ''}","${x.capturedAt || ''}"`)
      );
      const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'saito-promo-emails.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    async function loadBookings() {
      const res = await fetch('/api/admin/saito-bookings', { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const bookings = data.bookings || [];
      const head = '<div class="list-row head"><div>Cliente</div><div>Día / Hora</div><div>Monto</div><div>Estado / Acción</div></div>';
      if (!bookings.length) {
        document.getElementById('bookings-list').innerHTML = head + '<div style="padding:12px 0;color:#777;">Sin turnos todavía.</div>';
        return;
      }
      document.getElementById('bookings-list').innerHTML = head + bookings.map(b => {
        const statusEl = b.status === 'confirmed'
          ? '<span class="ok">✓ Confirmado</span>'
          : `<button type="button" class="btn sm" onclick="approveBooking('${esc(b.id)}')">Aprobar turno</button>`;
        return `
          <div class="list-row">
            <div><strong>${esc(b.name)}</strong><br><span style="color:#888;">${esc(b.email)}</span></div>
            <div>${esc(b.date)} · ${esc(b.slot)} hs</div>
            <div>$${Number(b.amount || 0).toLocaleString('es-AR')}</div>
            <div>${statusEl}</div>
          </div>
        `;
      }).join('');
    }

    async function approveBooking(id) {
      await fetch(`/api/admin/saito-bookings/${encodeURIComponent(id)}/approve`, {
        method: 'POST',
        headers: authHeaders()
      });
      loadBookings();
    }

    async function loadAll() {
      await Promise.all([loadConfig(), loadPromoEmails(), loadBookings()]);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
