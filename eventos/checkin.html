<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · THIS IS TOBBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f5f5f5;font-family:'IBM Plex Mono',monospace}.wrap{max-width:900px;margin:0 auto;padding:32px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;padding-bottom:18px}.eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#777}.title{font:500 clamp(28px,6vw,52px)/.95 system-ui,sans-serif;letter-spacing:-.06em;margin:42px 0 10px}.sub{color:#888;font-size:11px;line-height:1.7}.box{border:1px solid #292929;padding:20px;margin-top:24px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.input{background:transparent;border:1px solid #383838;color:#fff;padding:12px;font:12px 'IBM Plex Mono',monospace;min-height:42px}.input:focus{outline:1px solid #aaa}.btn{border:1px solid #aaa;background:transparent;color:#fff;padding:12px 16px;font:10px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.btn:hover{background:#fff;color:#000}.btn:disabled{opacity:.4}.message{min-height:22px;margin-top:14px;font-size:12px;color:#c6d5ce}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{padding:14px;border:1px solid #292929}.stat strong{display:block;font-size:22px;font-weight:400}.stat span{color:#777;font-size:9px;text-transform:uppercase;letter-spacing:.12em}.list{margin-top:24px;border-top:1px solid #292929}.ticket{display:grid;grid-template-columns:1.4fr 1.4fr .8fr .8fr;gap:12px;padding:13px 0;border-bottom:1px solid #222;font-size:10px;align-items:center}.ticket.head{color:#777;text-transform:uppercase;font-size:8px;letter-spacing:.1em}.arrived{color:#a9d3bd}.pending{color:#d3c7a9}.hidden{display:none!important}#reader{width:min(100%,420px);margin:18px auto 0}.scanner{text-align:center}.scanner .row{justify-content:center}@media(max-width:600px){.ticket{grid-template-columns:1.2fr 1.2fr .8fr}.ticket>*:nth-child(3){display:none}.stats{grid-template-columns:1fr}.input{flex:1;min-width:100%}}
  </style>
</head>
<body><main class="wrap">
  <div class="top"><a href="../home.html" style="color:#f5f5f5;text-decoration:none;font-size:11px;letter-spacing:.15em">LIMINAL RECORDS</a><span class="eyebrow">Acceso · 25.11.2026</span></div>
  <section id="login" class="box" style="max-width:420px;margin:70px auto"><div class="eyebrow">THIS IS TOBBA</div><h1 class="title" style="font-size:32px;margin:16px 0">Control de acceso</h1><form id="login-form"><input id="password" class="input" type="password" required placeholder="Contraseña del panel" style="width:100%"><button class="btn" style="width:100%;margin-top:12px">Ingresar</button></form><div class="message" id="login-message"></div></section>
  <section id="dashboard" class="hidden"><div class="eyebrow">THIS IS TOBBA / YUNTA BAR</div><h1 class="title">Ingreso de invitados</h1><div class="sub">Escaneá cada entrada una vez. El sistema indica si ya fue utilizada.</div>
    <div class="stats"><div class="stat"><strong id="reserved">—</strong><span>Entradas reservadas</span></div><div class="stat"><strong id="checked-in">—</strong><span>Ingresaron</span></div><div class="stat"><strong id="remaining">—</strong><span>Disponibles</span></div></div>
    <div class="box scanner"><div class="eyebrow">Escanear QR</div><div class="row" style="margin-top:14px"><button class="btn" id="start-camera">Abrir cámara</button><button class="btn" id="stop-camera" disabled>Cerrar cámara</button></div><div id="reader"></div><div class="row" style="margin-top:18px"><input id="manual-token" class="input" placeholder="O ingresá el código de la entrada"><button id="manual-check" class="btn">Validar</button></div><div class="message" id="scan-message" aria-live="polite"></div></div>
    <div class="row" style="justify-content:space-between;margin-top:28px"><div class="eyebrow">Entradas</div><button id="refresh" class="btn">Actualizar lista</button></div><div class="list" id="ticket-list"></div>
  </section>
</main>
<script src="../node_modules/html5-qrcode/html5-qrcode.min.js"></script>
<script>
let token='';let scanner;
const login=document.getElementById('login'),dashboard=document.getElementById('dashboard');
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('login-message');try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo ingresar');token=d.token;login.classList.add('hidden');dashboard.classList.remove('hidden');await loadTickets()}catch(err){out.textContent=err.message}});
async function loadTickets(){const r=await fetch('/api/admin/event-tickets',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo cargar');document.getElementById('reserved').textContent=d.reserved;document.getElementById('checked-in').textContent=d.checkedIn;document.getElementById('remaining').textContent=d.remaining;const list=document.getElementById('ticket-list');list.innerHTML='<div class="ticket head"><span>Asistente</span><span>Correo</span><span>Código</span><span>Estado</span></div>'+d.tickets.map(t=>`<div class="ticket"><span>${escapeHtml(t.name)}</span><span>${escapeHtml(t.email)}</span><span>${escapeHtml(t.code)}</span><span class="${t.checkedInAt?'arrived':'pending'}">${t.checkedInAt?'Ingresó':'Pendiente'}</span></div>`).join('')}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function checkIn(value){const out=document.getElementById('scan-message');const raw=String(value||'').trim();let ticketToken=raw;if(raw.includes('token=')){try{ticketToken=new URL(raw,location.href).searchParams.get('token')}catch(_){}}if(!ticketToken){out.textContent='No se encontró el código de la entrada.';return}out.textContent='Validando…';try{const r=await fetch('/api/admin/event-check-in',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({token:ticketToken})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo validar');out.textContent=d.alreadyCheckedIn?`Ya ingresó: ${d.ticket.name}`:`Ingreso validado: ${d.ticket.name}`;await loadTickets()}catch(err){out.textContent=err.message}}
document.getElementById('manual-check').addEventListener('click',()=>checkIn(document.getElementById('manual-token').value));document.getElementById('manual-token').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkIn(e.currentTarget.value)}});document.getElementById('refresh').addEventListener('click',loadTickets);
document.getElementById('start-camera').addEventListener('click',async()=>{const out=document.getElementById('scan-message');try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},text=>{scanner.pause(true);checkIn(text).finally(()=>setTimeout(()=>scanner&&scanner.resume(),1800))});document.getElementById('start-camera').disabled=true;document.getElementById('stop-camera').disabled=false;out.textContent='Cámara activa. Enfocá el QR.'}catch(e){out.textContent='No se pudo abrir la cámara. Revisá el permiso del navegador o usá el campo manual.'}});
document.getElementById('stop-camera').addEventListener('click',async()=>{if(scanner){await scanner.stop();scanner.clear();scanner=null}document.getElementById('start-camera').disabled=false;document.getElementById('stop-camera').disabled=true});
</script></body></html>
