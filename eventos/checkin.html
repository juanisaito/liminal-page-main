<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in · THIS IS TOBBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #070707;
      color: #f5f5f5;
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .wrap {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f1f1f;
      padding-bottom: 14px;
      margin-bottom: 20px;
      gap: 12px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .link-btn {
      background: none;
      border: none;
      color: #888;
      font: 9px 'IBM Plex Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
    }
    .link-btn:hover { color: #fff; }
    .eyebrow {
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #666;
    }
    .title {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -.03em;
      margin: 0 0 6px;
    }
    .box {
      border: 1px solid #222;
      background: #111;
      padding: 20px;
      border-radius: 6px;
    }
    .input {
      background: #0a0a0a;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      font: 12px 'IBM Plex Mono', monospace;
      width: 100%;
      border-radius: 4px;
      outline: none;
      margin-bottom: 12px;
    }
    .input:focus { border-color: #777; }
    .btn {
      border: 1px solid #444;
      background: transparent;
      color: #fff;
      padding: 12px 16px;
      font: 10px 'IBM Plex Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      width: 100%;
    }
    .btn:hover:not(:disabled) { background: #fff; color: #000; border-color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: #e0e0e0; }

    #reader {
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #222;
      background: #000;
      margin-top: 14px;
    }
    .camera-status {
      font-size: 11px;
      color: #ffccd5;
      margin-top: 10px;
      line-height: 1.4;
      text-align: center;
    }
    .hidden { display: none !important; }

    /* Contador de entradas abajo del lector */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
      text-align: center;
    }
    .stat-box {
      background: #0a0a0a;
      border: 1px solid #222;
      padding: 10px 6px;
      border-radius: 4px;
    }
    .stat-box strong { display: block; font-size: 16px; margin-top: 2px; font-weight: 500; }

    /* Pop-Up Modal Gigante Bloqueante */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      transform: scale(0.9);
      transition: transform 0.15s ease;
    }
    .modal-overlay.active .modal-card {
      transform: scale(1);
    }
    .modal-card.success { background: #0b291a; border: 2px solid #2d6a4f; color: #d8f3dc; }
    .modal-card.warning { background: #2e2404; border: 2px solid #b5830d; color: #fffaa0; }
    .modal-card.error { background: #330a0e; border: 2px solid #a4161a; color: #ffccd5; }

    .modal-title { font-size: 22px; font-weight: 600; margin: 10px 0; letter-spacing: -.02em; }
    .modal-subtitle { font-size: 14px; margin-bottom: 28px; opacity: 0.95; word-break: break-word; line-height: 1.4; }
    .modal-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 14px 24px;
      font: 12px 'IBM Plex Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      width: 100%;
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a href="/admin" style="color:#aaa; text-decoration:none; font-size:10px; letter-spacing:.15em;">← VOLVER AL ADMIN</a>
    <div class="top-actions">
      <span class="eyebrow">PUERTA · THIS IS TOBBA</span>
      <button type="button" id="logout-btn" class="link-btn hidden">Salir</button>
    </div>
  </div>

  <!-- Login (Multi-usuario con localStorage) -->
  <section id="login" class="box">
    <div class="eyebrow">SEGURIDAD</div>
    <h1 class="title" style="margin-top:6px;">Acceso Staff</h1>
    <p style="color:#888; font-size:11px; margin-bottom:16px;">Ingresá tus credenciales de operador.</p>
    <form id="login-form">
      <label class="eyebrow">Usuario</label>
      <input id="admin-user" class="input" type="text" required placeholder="ej: puerta" autocomplete="username">
      
      <label class="eyebrow">Contraseña</label>
      <div style="position: relative;">
        <input id="admin-password" class="input" type="password" required placeholder="••••••••" autocomplete="current-password" style="padding-right: 40px; margin-bottom: 0;">
        <button type="button" id="toggle-pass" style="position: absolute; right: 10px; top: 40%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; font-size: 14px;" title="Ver contraseña">👁️</button>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 18px;">Ingresar</button>
      <div id="login-message" style="margin-top:12px; font-size:11px; color:#ffccd5; text-align:center;"></div>
    </form>
  </section>

  <!-- Escáner Activo -->
  <section id="dashboard" class="hidden">
    <div>
      <h1 class="title">Escáner de Entradas</h1>
      <p style="color:#888; font-size:11px; margin:0 0 16px 0;">Apuntá la cámara al QR o ingresá el código manual.</p>
    </div>

    <div class="box">
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-primary" id="start-camera">Activar Cámara</button>
        <button type="button" class="btn" id="stop-camera" disabled>Detener</button>
      </div>
      
      <div id="reader"></div>
      <div id="camera-status" class="camera-status hidden"></div>

      <!-- Barra de Contador de Entradas Abajo del Lector -->
      <div class="stats-bar">
        <div class="stat-box">
          <span class="eyebrow">Emitidas</span>
          <strong id="stat-reserved">—</strong>
        </div>
        <div class="stat-box">
          <span class="eyebrow">Ingresaron</span>
          <strong id="stat-checked" style="color:#52b788">—</strong>
        </div>
        <div class="stat-box">
          <span class="eyebrow">Faltan entrar</span>
          <strong id="stat-remaining" style="color:#d4a373">—</strong>
        </div>
      </div>

      <div style="margin-top: 20px; border-top: 1px solid #222; padding-top: 16px;">
        <input id="manual-token" class="input" placeholder="O ingresá el código manual..." style="margin-bottom:8px;">
        <button type="button" id="manual-check" class="btn">Validar Código Manual</button>
      </div>
    </div>
  </section>
</main>

<!-- Pop-Up Modal Gigante Bloqueante -->
<div id="popup-modal" class="modal-overlay">
  <div id="modal-card" class="modal-card success">
    <div id="modal-eyebrow" class="eyebrow" style="letter-spacing: .25em; opacity: 0.8;">ESTADO</div>
    <div id="modal-title" class="modal-title">ACCESO CONCEDIDO</div>
    <div id="modal-subtitle" class="modal-subtitle">Nombre del asistente</div>
    <button type="button" class="modal-btn" id="close-popup">Siguiente (OK)</button>
  </div>
</div>

<script>
let authToken = localStorage.getItem('liminal_admin_token') || '';
let scanner = null;
let isProcessing = false;

const loginScreen = document.getElementById('login');
const dashboard = document.getElementById('dashboard');
const logoutBtn = document.getElementById('logout-btn');
const cameraStatus = document.getElementById('camera-status');
const modalOverlay = document.getElementById('popup-modal');
const modalCard = document.getElementById('modal-card');
const modalTitle = document.getElementById('modal-title');
const modalSubtitle = document.getElementById('modal-subtitle');
const modalEyebrow = document.getElementById('modal-eyebrow');

function setCameraStatus(msg) {
  if (!msg) {
    cameraStatus.textContent = '';
    cameraStatus.classList.add('hidden');
    return;
  }
  cameraStatus.textContent = msg;
  cameraStatus.classList.remove('hidden');
}

function showDashboard() {
  loginScreen.classList.add('hidden');
  dashboard.classList.remove('hidden');
  logoutBtn.classList.remove('hidden');
  loadStats();
}

// Auto-login si ya existía token guardado (la cámara se activa al tocar "Activar Cámara" o si ya estaba activa)
if (authToken) {
  showDashboard();
}

// Mostrar / Ocultar contraseña
document.getElementById('toggle-pass').addEventListener('click', () => {
  const passInput = document.getElementById('admin-password');
  const toggleBtn = document.getElementById('toggle-pass');
  if (passInput.type === 'password') {
    passInput.type = 'text';
    toggleBtn.textContent = '🔒';
  } else {
    passInput.type = 'password';
    toggleBtn.textContent = '👁️';
  }
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('admin-user').value.trim();
  const password = document.getElementById('admin-password').value;
  const msg = document.getElementById('login-message');
  msg.textContent = 'Verificando...';

  try {
    const res = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Credenciales incorrectas');

    authToken = data.token;
    localStorage.setItem('liminal_admin_token', authToken);
    msg.textContent = '';
    showDashboard();
    await initScanner();
  } catch (err) {
    msg.textContent = err.message;
  }
});

logoutBtn.addEventListener('click', async () => {
  await stopScanner();
  authToken = '';
  localStorage.removeItem('liminal_admin_token');
  dashboard.classList.add('hidden');
  logoutBtn.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  document.getElementById('admin-user').value = '';
  document.getElementById('admin-password').value = '';
});

// Cargar contadores en tiempo real
async function loadStats() {
  try {
    const res = await fetch('/api/admin/event-tickets', {
      headers: { Authorization: `Bearer ${authToken}` }
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('stat-reserved').textContent = data.reserved;
      document.getElementById('stat-checked').textContent = data.checkedIn;
      const pending = typeof data.pendingCheckIn === 'number'
        ? data.pendingCheckIn
        : Math.max(0, (data.reserved || 0) - (data.checkedIn || 0));
      document.getElementById('stat-remaining').textContent = pending;
    }
  } catch (err) {
    console.error('Error al actualizar contadores:', err);
  }
}

async function checkIn(rawValue) {
  if (isProcessing) return;
  isProcessing = true;

  const cleanVal = String(rawValue || '').trim();
  if (!cleanVal) {
    isProcessing = false;
    return;
  }

  // Extraer token si la cámara lee una URL completa
  let ticketToken = cleanVal;
  if (cleanVal.includes('http://') || cleanVal.includes('https://')) {
    try {
      const parsedUrl = new URL(cleanVal);
      const paramToken = parsedUrl.searchParams.get('token');
      if (paramToken) {
        ticketToken = paramToken;
      } else {
        const segments = parsedUrl.pathname.split('/').filter(Boolean);
        ticketToken = segments[segments.length - 1];
      }
    } catch (_) {}
  }

  try {
    const res = await fetch('/api/admin/event-check-in', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${authToken}`
      },
      body: JSON.stringify({ token: ticketToken })
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Entrada no válida');

    if (data.alreadyCheckedIn) {
      showPopup('warning', '⚠️ YA FUE UTILIZADA', data.ticket.name, 'ATENCIÓN');
    } else {
      showPopup('success', '✓ ACCESO CONCEDIDO', data.ticket.name, 'OK');
    }
    
    await loadStats();
  } catch (err) {
    showPopup('error', '❌ ERROR / NO VÁLIDA', err.message, 'DENEGADO');
  }

  document.getElementById('manual-token').value = '';
}

function showPopup(type, title, subtitleText, eyebrowText) {
  modalCard.className = `modal-card ${type}`;
  modalTitle.textContent = title;
  modalSubtitle.textContent = subtitleText;
  modalEyebrow.textContent = eyebrowText;
  modalOverlay.classList.add('active');
}

function closePopupModal() {
  modalOverlay.classList.remove('active');
  isProcessing = false;
}

document.getElementById('close-popup').addEventListener('click', closePopupModal);

document.addEventListener('keydown', (e) => {
  if (!modalOverlay.classList.contains('active')) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    closePopupModal();
  }
});

document.getElementById('manual-check').addEventListener('click', () => checkIn(document.getElementById('manual-token').value));
document.getElementById('manual-token').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); checkIn(e.currentTarget.value); }
});

async function initScanner() {
  setCameraStatus('');
  try {
    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 20, qrbox: { width: 250, height: 250 } },
      async (decodedText) => {
        if (!isProcessing) {
          await checkIn(decodedText);
        }
      },
      () => {}
    );
    document.getElementById('start-camera').disabled = true;
    document.getElementById('stop-camera').disabled = false;
  } catch (e) {
    console.error('Error al iniciar cámara:', e);
    setCameraStatus('No se pudo abrir la cámara. Revisá los permisos del navegador (requiere HTTPS) o usá el código manual.');
    document.getElementById('start-camera').disabled = false;
    document.getElementById('stop-camera').disabled = true;
  }
}

async function stopScanner() {
  if (scanner) {
    try { await scanner.stop(); await scanner.clear(); } catch(_){}
    scanner = null;
  }
  document.getElementById('start-camera').disabled = false;
  document.getElementById('stop-camera').disabled = true;
}

document.getElementById('start-camera').addEventListener('click', initScanner);
document.getElementById('stop-camera').addEventListener('click', stopScanner);
</script>
</body>
</html>
