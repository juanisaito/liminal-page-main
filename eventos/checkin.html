<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in · THIS IS TOBBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #070707;
      color: #f5f5f5;
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .wrap {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f1f1f;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    .eyebrow {
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #666;
    }
    .title {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -.03em;
      margin: 0 0 6px;
    }
    .box {
      border: 1px solid #222;
      background: #111;
      padding: 20px;
      border-radius: 6px;
    }
    .input {
      background: #0a0a0a;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      font: 12px 'IBM Plex Mono', monospace;
      width: 100%;
      border-radius: 4px;
      outline: none;
      margin-bottom: 12px;
    }
    .input:focus { border-color: #777; }
    .btn {
      border: 1px solid #444;
      background: transparent;
      color: #fff;
      padding: 12px 16px;
      font: 10px 'IBM Plex Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      width: 100%;
    }
    .btn:hover { background: #fff; color: #000; border-color: #fff; }
    .btn-primary { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
    .btn-primary:hover { background: #e0e0e0; }
    
    /* Pantalla de Feedback Gigante para el Staff */
    #scan-result {
      margin-top: 20px;
      padding: 24px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    #scan-result.success { background: #0f2d1e; border: 2px solid #2d6a4f; color: #d8f3dc; display: block; }
    #scan-result.warning { background: #332705; border: 2px solid #b5830d; color: #fffaa0; display: block; }
    #scan-result.error { background: #3d0c11; border: 2px solid #a4161a; color: #ffccd5; display: block; }
    
    #reader {
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #222;
      background: #000;
      margin-top: 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a href="/admin" style="color:#aaa; text-decoration:none; font-size:10px; letter-spacing:.15em;">← VOLVER AL ADMIN</a>
    <span class="eyebrow">PUERTA · THIS IS TOBBA</span>
  </div>

  <!-- Login (Solo si no hay token guardado) -->
  <section id="login" class="box">
    <div class="eyebrow">SEGURIDAD</div>
    <h1 class="title" style="margin-top:6px;">Acceso Staff</h1>
    <p style="color:#888; font-size:11px; margin-bottom:16px;">Ingresá la contraseña de administración una sola vez.</p>
    <form id="login-form">
      <input id="password" class="input" type="password" required placeholder="Contraseña">
      <button class="btn btn-primary">Ingresar</button>
    </form>
    <div id="login-message" style="margin-top:12px; font-size:11px; color:#ffccd5;"></div>
  </section>

  <!-- Escáner Activo -->
  <section id="dashboard" class="hidden">
    <div>
      <h1 class="title">Escáner de Entradas</h1>
      <p style="color:#888; font-size:11px; margin:0 0 16px 0;">Apunta la cámara al QR del asistente o ingresa el código manual.</p>
    </div>

    <div class="box">
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="start-camera">Activar Cámara</button>
        <button class="btn" id="stop-camera" disabled>Detener</button>
      </div>
      
      <div id="reader"></div>

      <div style="margin-top: 20px; border-top: 1px solid #222; padding-top: 16px;">
        <input id="manual-token" class="input" placeholder="O ingresá el código manual..." style="margin-bottom:8px;">
        <button id="manual-check" class="btn">Validar Código Manual</button>
      </div>

      <!-- Tarjeta de Feedback Visual Grande -->
      <div id="scan-result"></div>
    </div>
  </section>
</main>

<script>
let authToken = localStorage.getItem('liminal_admin_token') || '';
let scanner = null;
let isProcessing = false;

const loginScreen = document.getElementById('login');
const dashboard = document.getElementById('dashboard');

// Auto-login si ya existía token guardado
if (authToken) {
  loginScreen.classList.add('hidden');
  dashboard.classList.remove('hidden');
  initScanner();
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = document.getElementById('password').value;
  const msg = document.getElementById('login-message');
  msg.textContent = 'Verificando...';

  try {
    const res = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Contraseña incorrecta');

    authToken = data.token;
    localStorage.setItem('liminal_admin_token', authToken);
    loginScreen.classList.add('hidden');
    dashboard.classList.remove('hidden');
    initScanner();
  } catch (err) {
    msg.textContent = err.message;
  }
});

async function checkIn(rawValue) {
  if (isProcessing) return;
  isProcessing = true;

  const resultBox = document.getElementById('scan-result');
  const cleanVal = String(rawValue || '').trim();
  
  if (!cleanVal) {
    isProcessing = false;
    return;
  }

  // Extraer token si la cámara lee una URL completa
  let ticketToken = cleanVal;
  if (cleanVal.includes('http://') || cleanVal.includes('https://')) {
    try {
      const parsedUrl = new URL(cleanVal);
      const paramToken = parsedUrl.searchParams.get('token');
      if (paramToken) {
        ticketToken = paramToken;
      } else {
        const segments = parsedUrl.pathname.split('/').filter(Boolean);
        ticketToken = segments[segments.length - 1];
      }
    } catch (_) {}
  }

  resultBox.className = 'warning';
  resultBox.innerHTML = '<span style="font-size:12px;">Verificando entrada...</span>';

  try {
    const res = await fetch('/api/admin/event-check-in', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${authToken}`
      },
      body: JSON.stringify({ token: ticketToken })
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Entrada no válida');

    if (data.alreadyCheckedIn) {
      resultBox.className = 'warning';
      resultBox.innerHTML = `
        <div style="font-size:10px; letter-spacing:.15em; margin-bottom:4px;">⚠️ ATENCIÓN</div>
        <div style="font-size:18px; font-weight:600; margin-bottom:6px;">YA FUE UTILIZADA</div>
        <div style="font-size:13px;">${escapeHtml(data.ticket.name)}</div>
      `;
    } else {
      resultBox.className = 'success';
      resultBox.innerHTML = `
        <div style="font-size:10px; letter-spacing:.15em; margin-bottom:4px;">✅ ACCESO CONCEDIDO</div>
        <div style="font-size:22px; font-weight:600; margin-bottom:6px;">${escapeHtml(data.ticket.name)}</div>
        <div style="font-size:11px; opacity:0.8;">Código: ${escapeHtml(data.ticket.code)}</div>
      `;
    }
  } catch (err) {
    resultBox.className = 'error';
    resultBox.innerHTML = `
      <div style="font-size:10px; letter-spacing:.15em; margin-bottom:4px;">❌ ERROR</div>
      <div style="font-size:16px; font-weight:600;">${escapeHtml(err.message)}</div>
    `;
  }

  document.getElementById('manual-token').value = '';
  
  // Permitir nuevo escaneo tras 3.5 segundos
  setTimeout(() => {
    isProcessing = false;
  }, 3500);
}

document.getElementById('manual-check').addEventListener('click', () => checkIn(document.getElementById('manual-token').value));
document.getElementById('manual-token').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); checkIn(e.currentTarget.value); }
});

async function initScanner() {
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 20, qrbox: { width: 250, height: 250 } },
      async (decodedText) => {
        if (!isProcessing) {
          await checkIn(decodedText);
        }
      },
      () => {}
    );
    document.getElementById('start-camera').disabled = true;
    document.getElementById('stop-camera').disabled = false;
  } catch (e) {
    console.error('Error al iniciar cámara:', e);
  }
}

document.getElementById('stop-camera').addEventListener('click', async () => {
  if (scanner) {
    try { await scanner.stop(); await scanner.clear(); } catch(_){}
    scanner = null;
  }
  document.getElementById('start-camera').disabled = false;
  document.getElementById('stop-camera').disabled = true;
});

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}
</script>
</body>
</html>
